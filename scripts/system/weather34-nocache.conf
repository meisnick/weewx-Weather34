# Apache: the live data files must never come from a browser or proxy cache.
# Install as /etc/apache2/conf-available/weather34-nocache.conf, then: a2enmod headers; a2enconf weather34-nocache
# (prod carries the same four blocks inside its 000-default vhost)
<Directory /var/www/html/weewx/weather34/w34highcharts/json>
	<IfModule mod_headers.c>
		Header set Cache-Control "no-cache, must-revalidate"
	</IfModule>
</Directory>
<Directory /var/www/html/weewx/weather34/w34highcharts/json_day>
	<IfModule mod_headers.c>
		Header set Cache-Control "no-cache, must-revalidate"
	</IfModule>
</Directory>
<Directory /var/www/html/weewx/weather34/jsondata>
	<IfModule mod_headers.c>
		Header set Cache-Control "no-cache, must-revalidate"
	</IfModule>
</Directory>
<Directory /var/www/html/weewx/weather34/serverdata>
	<IfModule mod_headers.c>
		Header set Cache-Control "no-cache, must-revalidate"
	</IfModule>
</Directory>
