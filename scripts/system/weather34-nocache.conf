# Apache: the live data files must never come from a browser or proxy cache.
# Install as /etc/apache2/conf-available/weather34-nocache.conf, then: a2enmod headers; a2enconf weather34-nocache
# (prod carries the same six blocks inside its 000-default vhost)
# The static chart and daylight-map pages and their scripts and styles too: plain .html can't stamp file times onto
# its links the way the PHP pages do, so a browser that guesses them fresh kept running old code for days after an
# update. no-cache still lets it reuse them after a 304.
<Directory /var/www/html/weewx/weather34/w34highcharts>
	<FilesMatch "\.(html|js|css)$">
		<IfModule mod_headers.c>
			Header set Cache-Control "no-cache, must-revalidate"
		</IfModule>
	</FilesMatch>
</Directory>
<Directory /var/www/html/weewx/weather34/daylightmap>
	<FilesMatch "\.(html|js|css)$">
		<IfModule mod_headers.c>
			Header set Cache-Control "no-cache, must-revalidate"
		</IfModule>
	</FilesMatch>
</Directory>
<Directory /var/www/html/weewx/weather34/w34highcharts/json>
	<IfModule mod_headers.c>
		Header set Cache-Control "no-cache, must-revalidate"
	</IfModule>
</Directory>
<Directory /var/www/html/weewx/weather34/w34highcharts/json_day>
	<IfModule mod_headers.c>
		Header set Cache-Control "no-cache, must-revalidate"
	</IfModule>
</Directory>
<Directory /var/www/html/weewx/weather34/jsondata>
	<IfModule mod_headers.c>
		Header set Cache-Control "no-cache, must-revalidate"
	</IfModule>
</Directory>
<Directory /var/www/html/weewx/weather34/serverdata>
	<IfModule mod_headers.c>
		Header set Cache-Control "no-cache, must-revalidate"
	</IfModule>
</Directory>
